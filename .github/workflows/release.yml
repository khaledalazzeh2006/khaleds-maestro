# Builds the Windows installer and publishes it as a GitHub Release; installed copies update from it.
# No secrets to set up: GitHub gives every run its own GITHUB_TOKEN automatically.
# Start it by pushing a version tag (see RELEASE.md).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # lets the built-in token create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build and publish the installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
